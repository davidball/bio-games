<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribosome Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { color: #58a6ff; margin-bottom: 4px; }
  .subtitle { color: #8b949e; margin-bottom: 20px; font-size: 14px; }
  #game { width: 100%; max-width: 720px; }
  .strand-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 18px; }
  .label { color: #8b949e; width: 36px; font-size: 13px; }
  .base { display: inline-block; width: 22px; text-align: center; }
  .base.correct { color: #3fb950; }
  .base.wrong { color: #f85149; background: #3d1214; border-radius: 3px; }
  .base.pending { color: #484f58; }
  .base.wobble { color: #d29922; background: #3a2d0b; border-radius: 3px; }
  .codon-group { border-left: 2px solid #30363d; margin-left: 4px; padding-left: 4px; }
  #input-row { margin: 16px 0; }
  #typed { font-size: 22px; letter-spacing: 4px; }
  #typed .cursor { color: #58a6ff; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #feedback { min-height: 24px; margin-bottom: 12px; font-size: 15px; }
  #feedback.good { color: #3fb950; }
  #feedback.bad { color: #f85149; }
  #feedback.wobble { color: #d29922; }
  #hint { color: #d29922; background: #2b2109; border: 1px solid #5c4813; border-radius: 6px;
          padding: 6px 10px; margin-bottom: 12px; font-size: 13px; }
  .protein { margin: 16px 0; font-size: 20px; }
  .bead { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 12px; font-size: 14px; }
  .stats { color: #8b949e; font-size: 13px; margin-top: 12px; }
  button {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 8px 20px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 15px;
  }
  button:hover { background: #30363d; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>Ribosome Rush</h1>
<p class="subtitle">Type the mRNA. Build the protein. Watch one typo change everything.</p>

<div id="game">
  <div id="stage-label" class="subtitle"></div>

  <div class="strand-row">
    <span class="label">DNA</span>
    <span id="dna-strand"></span>
  </div>
  <div class="strand-row">
    <span class="label">mRNA</span>
    <span id="rna-strand"></span>
  </div>

  <div id="input-row">
    <span id="typed"><span class="cursor">|</span></span>
  </div>
  <div id="feedback"></div>
  <div id="hint" class="hidden"></div>

  <div class="protein" id="protein"></div>
  <div class="stats" id="stats"></div>

  <div id="start-screen">
    <button id="start-btn">Start</button>
  </div>
  <div id="end-screen" class="hidden">
    <p id="end-msg"></p>
    <button id="next-btn">Next gene</button>
  </div>
</div>

<script>
// Pairing rules. The player types mRNA (RNA) bases directly: A, U, G, C.
// DNA template -> expected mRNA base: A->U, T->A, C->G, G->C
const MRNA_FOR_TEMPLATE = { A: 'U', T: 'A', G: 'C', C: 'G' };
// Equivalent check from the typed mRNA base back to the template: A->T, U->A, G->C, C->G
const TEMPLATE_FOR_MRNA = { A: 'T', U: 'A', G: 'C', C: 'G' };
const RNA_KEYS = ['A', 'U', 'G', 'C'];

// Wobble rules (3rd codon position only, i % 3 === 2). A wrong base is accepted as a
// "wobble" if the typed base and the expected base fall in the same group:
//   - pyrimidines {U, C}: anticodon G reads U or C (G-U wobble)
//   - purines {A, G}:     anticodon U reads A or G
//   - inosine {U, C, A}:  anticodon I reads U, C, or A
// A wobble-accepted base is translated as the expected base (silent: same amino acid).
const WOBBLE_GROUPS = [
  ['U', 'C'],
  ['A', 'G'],
  ['U', 'C', 'A']
];
const WOBBLE_HINT = 'Wobble! The 3rd codon base can pair loosely with the tRNA anticodon (G–U, I–U/C/A), so the same amino acid still gets added.';

// 64-codon table: codon -> amino acid (3-letter). Stops = null.
const CODONS = {
  UUU:'Phe', UUC:'Phe', UUA:'Leu', UUG:'Leu', CUU:'Leu', CUC:'Leu', CUA:'Leu', CUG:'Leu',
  AUU:'Ile', AUC:'Ile', AUA:'Ile', AUG:'Met', GUU:'Val', GUC:'Val', GUA:'Val', GUG:'Val',
  UCU:'Ser', UCC:'Ser', UCA:'Ser', UCG:'Ser', CCU:'Pro', CCC:'Pro', CCA:'Pro', CCG:'Pro',
  ACU:'Thr', ACC:'Thr', ACA:'Thr', ACG:'Thr', GCU:'Ala', GCC:'Ala', GCA:'Ala', GCG:'Ala',
  UAU:'Tyr', UAC:'Tyr', UAA:null,  UAG:null,  CAU:'His', CAC:'His', CAA:'Gln', CAG:'Gln',
  AAU:'Asn', AAC:'Asn', AAA:'Lys', AAG:'Lys', GAU:'Asp', GAC:'Asp', GAA:'Glu', GAG:'Glu',
  UGU:'Cys', UGC:'Cys', UGA:null,  UGG:'Trp', CGU:'Arg', CGC:'Arg', CGA:'Arg', CGG:'Arg',
  AGU:'Ser', AGC:'Ser', AGA:'Arg', AGG:'Arg', GGU:'Gly', GGC:'Gly', GGA:'Gly', GGG:'Gly'
};

// Bead colors per amino acid family
const COLOR = {
  Phe:'#f0883e', Leu:'#f0883e', Ile:'#f0883e', Met:'#a371f7', Val:'#f0883e', Ser:'#3fb950', Pro:'#3fb950', Thr:'#3fb950', Ala:'#3fb950', Tyr:'#f85149', His:'#58a6ff', Gln:'#58a6ff', Asn:'#58a6ff', Lys:'#f85149', Asp:'#f85149', Glu:'#f85149', Cys:'#ffa657', Trp:'#ffa657', Arg:'#ffa657', Gly:'#8b949e'
};

// Short real-ish genes: [name, DNA template strand 5'->3']
// Insulin B-chain start (real), plus a couple of short synthetic teaching genes.
const GENES = [
  { name: 'Insulin B-chain (start)', dna: 'TTCGTGAACCAGCACCTGTGC' },
  { name: 'Teaching gene A', dna: 'TACATGTTCTACGGATTC' },
  { name: 'Teaching gene B', dna: 'TACGGATTCTACATGTTC' },
  { name: 'Teaching gene C', dna: 'TACATGCCUAAG' }, // invalid placeholder, replaced below
  { name: 'Teaching gene D', dna: 'TACATGTTCTACGGATTCTACATGTTC' }
];
// Fix gene C: DNA template 3'->5' written 5'->3': TAC ATG TTC TAC GGA TTC
GENES[3] = { name: 'Teaching gene C', dna: 'TACATGTTCTACGGATTC' };

let geneIndex = 0;
let pos = 0;          // index into dna template
let typed = '';
let protein = [];     // amino acid names built
let mistakes = 0;
let startTime = null;
let finished = false;
let wobbleHintShown = false;

const dnaEl = document.getElementById('dna-strand');
const rnaEl = document.getElementById('rna-strand');
const typedEl = document.getElementById('typed');
const feedbackEl = document.getElementById('feedback');
const hintEl = document.getElementById('hint');
const proteinEl = document.getElementById('protein');
const statsEl = document.getElementById('stats');
const stageLabel = document.getElementById('stage-label');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const endMsg = document.getElementById('end-msg');

const INSTRUCTIONS = 'Type the mRNA bases (A, U, G, C) that pair with each DNA template base: A→U, T→A, C→G, G→C. RNA uses U, not T.';

function expectedBase(i) {
  return MRNA_FOR_TEMPLATE[GENES[geneIndex].dna[i]];
}

function isWobble(i, base) {
  if (i % 3 !== 2) return false;
  const exp = expectedBase(i);
  if (!exp || base === exp) return false;
  return WOBBLE_GROUPS.some(g => g.includes(base) && g.includes(exp));
}

// 'correct' | 'wobble' | 'wrong' for the typed mRNA base at position i
function baseStatus(i) {
  const dna = GENES[geneIndex].dna;
  if (TEMPLATE_FOR_MRNA[typed[i]] === dna[i]) return 'correct';
  if (isWobble(i, typed[i])) return 'wobble';
  return 'wrong';
}

function showWobbleHint() {
  if (wobbleHintShown) return;
  wobbleHintShown = true;
  hintEl.textContent = WOBBLE_HINT;
  hintEl.classList.remove('hidden');
}

function render() {
  const dna = GENES[geneIndex].dna;
  const gapAt = i => (i > 0 && i % 3 === 0) ? "<span style='display:inline-block;width:6px'></span>" : '';

  // DNA row: the template, 5'->3', grouped by codon
  let d = "<span class='label'>5'</span>";
  for (let i = 0; i < dna.length; i++) {
    d += gapAt(i) + `<span class='base'>${dna[i]}</span>`;
  }
  d += "<span class='label'>3'</span>";

  // mRNA row: the bases the player typed (green correct, amber wobble, red wrong), pending faint
  let m = "<span class='label'>5'</span>";
  for (let i = 0; i < dna.length; i++) {
    if (i < typed.length) {
      m += gapAt(i) + `<span class='base ${baseStatus(i)}'>${typed[i]}</span>`;
    } else {
      m += gapAt(i) + `<span class='base pending'>·</span>`;
    }
  }
  m += "<span class='label'>3'</span>";

  dnaEl.innerHTML = d;
  rnaEl.innerHTML = m;

  typedEl.innerHTML = typed + "<span class='cursor'>|</span>";
  proteinEl.innerHTML = protein.map(aa => {
    const bg = COLOR[aa] || '#8b949e';
    return `<span class='bead' style='background:${bg};color:#0d1117'>${aa}</span>`;
  }).join('');

  const elapsed = startTime ? ((Date.now() - startTime) / 1000) : 0;
  const bpm = elapsed > 0 ? Math.round(typed.length / elapsed * 60) : 0;
  statsEl.textContent = `Gene ${geneIndex + 1} of ${GENES.length}  ·  ${mistakes} mistake${mistakes === 1 ? '' : 's'}  ·  ${bpm} bases/min`;
}

function finishGene(reason) {
  finished = true;
  const elapsed = (Date.now() - startTime) / 1000;
  const bpm = Math.round(typed.length / elapsed * 60);
  endMsg.textContent = `Protein complete: ${protein.join('-')}  ·  ${mistakes} mistakes  ·  ${bpm} bases/min. ${reason}`;
  endScreen.classList.remove('hidden');
  startScreen.classList.add('hidden');
  feedbackEl.textContent = '';
}

function checkCodons() {
  // Every 3 typed mRNA bases, evaluate the codon
  while (typed.length >= 3 && protein.length * 3 < typed.length) {
    const start = protein.length * 3;
    const codon = typed.slice(start, start + 3);
    if (codon.length < 3) break;
    // A wobble-accepted 3rd base is read as the expected base, so it never changes the
    // amino acid. Hard errors are translated exactly as typed (missense / nonsense).
    let readCodon = '';
    for (let k = 0; k < 3; k++) {
      readCodon += baseStatus(start + k) === 'wobble' ? expectedBase(start + k) : codon[k];
    }
    const wobbled = readCodon !== codon;
    const aa = CODONS[readCodon];
    if (aa === undefined) {
      // invalid codon — treat as mistake, don't advance protein
      mistakes++;
      feedbackEl.textContent = `Invalid codon: ${codon}`;
      feedbackEl.className = 'bad';
      break;
    }
    if (aa === null) {
      // stop codon
      finishGene('Stop codon hit.');
      break;
    }
    protein.push(aa);
    if (wobbled) {
      feedbackEl.textContent = `Codon ${codon} → ${aa} (wobble: read like ${readCodon}, same amino acid)`;
      feedbackEl.className = 'wobble';
    } else {
      feedbackEl.textContent = `Codon ${codon} → ${aa}`;
      feedbackEl.className = 'good';
    }
  }
  // Whole template transcribed without a stop codon: the gene is done
  if (!finished && typed.length >= GENES[geneIndex].dna.length) {
    finishGene('End of template.');
  }
}

function onKey(e) {
  if (finished || !startTime) return; // not started, or gene already done
  if (e.key.length !== 1) return;
  const ch = e.key.toUpperCase();
  const dna = GENES[geneIndex].dna;
  if (typed.length >= dna.length) return;
  if (ch === 'T') {
    // T is rejected: RNA uses U instead of T
    feedbackEl.textContent = 'RNA has no T — type U instead (template A pairs with mRNA U).';
    feedbackEl.className = 'bad';
    return;
  }
  // Only accept mRNA bases A, U, G, C
  if (!RNA_KEYS.includes(ch)) return;
  typed += ch;
  const i = typed.length - 1;
  const expected = expectedBase(i);
  const status = baseStatus(i);
  if (status === 'wrong') {
    mistakes++;
    feedbackEl.textContent = `Wrong mRNA base: you typed ${ch}, expected ${expected} (pairs with template ${dna[i]})`;
    feedbackEl.className = 'bad';
  } else if (status === 'wobble') {
    feedbackEl.textContent = `Wobble: you typed ${ch}, expected ${expected} at codon position 3 — accepted`;
    feedbackEl.className = 'wobble';
    showWobbleHint();
  } else {
    feedbackEl.textContent = '';
  }
  checkCodons();
  render();
}

function startGame() {
  geneIndex = 0;
  pos = 0; typed = ''; protein = []; mistakes = 0; finished = false; startTime = Date.now();
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  stageLabel.textContent = `Stage 1: Transcription — type the mRNA bases for the DNA template. ${INSTRUCTIONS}`;
  render();
}

function nextGene() {
  geneIndex++;
  if (geneIndex >= GENES.length) {
    endMsg.textContent = 'All genes done. You built real proteins by typing mRNA bases.';
    endScreen.classList.remove('hidden');
    return;
  }
  typed = ''; protein = []; mistakes = 0; finished = false; startTime = Date.now();
  endScreen.classList.add('hidden');
  feedbackEl.textContent = '';
  stageLabel.textContent = `Stage 1: Transcription — gene ${geneIndex + 1}: type the mRNA bases (A, U, G, C).`;
  render();
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('next-btn').addEventListener('click', nextGene);
document.addEventListener('keydown', onKey);
render();
</script>
</body>
</html>
